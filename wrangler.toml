name = "plot-tycoon"
main = "worker/index.js"
compatibility_date = "2025-01-01"

# `npm run build` copies the browser files into public/ and wraps game.js for the Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "WORLD"
class_name = "World"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["World"]
